plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.devtools.ksp"
    id "com.google.dagger.hilt.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def phoneAgentSigningProperties = new Properties()
def phoneAgentSigningPropertiesFile = [
        rootProject.file("signing.properties"),
        file("../signing.properties")
].find { it.exists() }
if (phoneAgentSigningPropertiesFile != null) {
    phoneAgentSigningPropertiesFile.withInputStream { phoneAgentSigningProperties.load(it) }
}

def phoneAgentSigningValue = { name ->
    def envValue = System.getenv(name)
    if (envValue) {
        return envValue
    }
    def propertyValue = phoneAgentSigningProperties.getProperty(name)
    if (propertyValue) {
        return propertyValue
    }
    def bomSafeEntry = phoneAgentSigningProperties.find {
        it.key.toString().replace("\uFEFF", "") == name
    }
    return bomSafeEntry?.value
}

def phoneAgentKeystorePath = phoneAgentSigningValue("PHONE_AGENT_KEYSTORE_PATH")
def phoneAgentKeystorePassword = phoneAgentSigningValue("PHONE_AGENT_KEYSTORE_PASSWORD")
def phoneAgentKeyAlias = phoneAgentSigningValue("PHONE_AGENT_KEY_ALIAS")
def phoneAgentKeyPassword = phoneAgentSigningValue("PHONE_AGENT_KEY_PASSWORD")

def phoneAgentReleaseSigningReady =
        phoneAgentKeystorePath &&
        phoneAgentKeystorePassword &&
        phoneAgentKeyAlias &&
        phoneAgentKeyPassword

def phoneAgentReleaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

if (phoneAgentReleaseTaskRequested && !phoneAgentReleaseSigningReady) {
    throw new GradleException("Release signing is required. Set PHONE_AGENT_* env vars or create ignored android/signing.properties.")
}

android {
    namespace "com.phoneagent.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.phoneagent.app"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.1.2-closed"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BACKEND_BASE_URL", "\"https://phone-agent-47585065917.us-central1.run.app\""
        buildConfigField "String", "PHONE_AGENT_NUMBER", "\"+19143593659\""
        buildConfigField "String", "PHONE_AGENT_NUMBER_DISPLAY", "\"+1 (914) 359-3659\""
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (phoneAgentReleaseSigningReady) {
                storeFile file(phoneAgentKeystorePath)
                storePassword phoneAgentKeystorePassword
                keyAlias phoneAgentKeyAlias
                keyPassword phoneAgentKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (phoneAgentReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.incremental", "true")
}

