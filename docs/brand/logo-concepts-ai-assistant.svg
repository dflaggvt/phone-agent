<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Call Held AI assistant logo directions</title>
  <desc id="desc">Logo concepts for Call Held focused on an AI assistant taking calls for the user.</desc>
  <defs>
    <linearGradient id="violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7A63D9"/>
      <stop offset=".55" stop-color="#412977"/>
      <stop offset="1" stop-color="#130622"/>
    </linearGradient>
    <linearGradient id="midnight" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2C2744"/>
      <stop offset="1" stop-color="#0D0718"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#EFE6DA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#130622" flood-opacity=".16"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#130622" flood-opacity=".22"/>
    </filter>
    <style>
      .page-title { fill:#140722; font-family: Inter, Arial, sans-serif; font-size: 44px; font-weight: 850; letter-spacing: -0.02em; }
      .page-copy { fill:#675F72; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 500; }
      .label { fill:#140722; font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 850; letter-spacing: -0.015em; }
      .note { fill:#675F72; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 500; }
      .tag { fill:#0C8069; font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 850; letter-spacing: .10em; }
      .word { fill:#140722; font-family: Inter, Arial, sans-serif; font-size: 58px; font-weight: 840; letter-spacing: -0.045em; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#F8F5FC"/>

  <text x="88" y="92" class="page-title">AI assistant taking calls for you</text>
  <text x="88" y="132" class="page-copy">These focus less on “hold” and more on an assistant presence answering, listening, and deciding what needs you.</text>

  <!-- Direction 1 -->
  <g transform="translate(88 190)">
    <rect x="0" y="0" width="1424" height="230" rx="42" fill="#FFFFFF" filter="url(#shadow)"/>
    <g transform="translate(42 35)">
      <rect width="160" height="160" rx="38" fill="url(#violet)"/>
      <g filter="url(#markShadow)">
        <path d="M80 34C111 34 136 59 136 90C136 121 111 146 80 146C49 146 24 121 24 90C24 59 49 34 80 34Z" fill="url(#cream)"/>
        <path d="M53 87C53 71 65 59 81 59C97 59 109 71 109 87C109 103 97 115 81 115C65 115 53 103 53 87Z" fill="none" stroke="#140722" stroke-width="10"/>
        <path d="M43 89C34 89 27 96 27 105C27 114 34 121 43 121" fill="none" stroke="#FFF8EF" stroke-width="11" stroke-linecap="round"/>
        <path d="M117 89C126 89 133 96 133 105C133 114 126 121 117 121" fill="none" stroke="#FFF8EF" stroke-width="11" stroke-linecap="round"/>
        <path d="M67 87H95" stroke="#140722" stroke-width="10" stroke-linecap="round"/>
        <path d="M80 59V115" stroke="#140722" stroke-width="10" stroke-linecap="round"/>
        <circle cx="119" cy="42" r="6" fill="#7BE0B2"/>
      </g>
    </g>
    <g transform="translate(250 70)">
      <text x="0" y="0" class="tag">RECOMMENDED</text>
      <text x="0" y="54" class="label">Assistant Answer</text>
      <text x="0" y="88" class="note">An AI agent wearing the call: face/listener + phone headset without a literal handset.</text>
    </g>
    <g transform="translate(958 75)">
      <g transform="translate(0 0) scale(.62)">
        <path d="M80 34C111 34 136 59 136 90C136 121 111 146 80 146C49 146 24 121 24 90C24 59 49 34 80 34Z" fill="#140722"/>
        <path d="M53 87C53 71 65 59 81 59C97 59 109 71 109 87C109 103 97 115 81 115C65 115 53 103 53 87Z" fill="none" stroke="#FFF8EF" stroke-width="10"/>
        <path d="M67 87H95" stroke="#FFF8EF" stroke-width="10" stroke-linecap="round"/>
        <path d="M80 59V115" stroke="#FFF8EF" stroke-width="10" stroke-linecap="round"/>
      </g>
      <text x="112" y="66" class="word">Call Held</text>
    </g>
  </g>

  <!-- Direction 2 -->
  <g transform="translate(88 466)">
    <rect x="0" y="0" width="1424" height="230" rx="42" fill="#FFFFFF" filter="url(#shadow)"/>
    <g transform="translate(42 35)">
      <rect width="160" height="160" rx="38" fill="url(#midnight)"/>
      <g filter="url(#markShadow)">
        <path d="M42 57H106C128 57 145 74 145 96C145 118 128 135 106 135H82L46 156V135H42C20 135 3 118 3 96C3 74 20 57 42 57Z" fill="#FFF8EF"/>
        <path d="M50 96H99" stroke="#140722" stroke-width="11" stroke-linecap="round"/>
        <path d="M75 72V120" stroke="#140722" stroke-width="11" stroke-linecap="round"/>
        <path d="M116 72C127 79 134 91 134 105C134 119 127 131 116 138" fill="none" stroke="#7BE0B2" stroke-width="8" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(250 73)">
      <text x="0" y="0" class="label">Agent Bubble</text>
      <text x="0" y="34" class="note">A communication bubble with an AI node inside. Very clear for assistant + conversation.</text>
    </g>
    <g transform="translate(958 75)">
      <g transform="translate(0 0) scale(.62)">
        <path d="M42 57H106C128 57 145 74 145 96C145 118 128 135 106 135H82L46 156V135H42C20 135 3 118 3 96C3 74 20 57 42 57Z" fill="#140722"/>
        <path d="M50 96H99" stroke="#FFF8EF" stroke-width="11" stroke-linecap="round"/>
        <path d="M75 72V120" stroke="#FFF8EF" stroke-width="11" stroke-linecap="round"/>
      </g>
      <text x="112" y="66" class="word">Call Held</text>
    </g>
  </g>

  <!-- Direction 3 -->
  <g transform="translate(88 742)">
    <rect x="0" y="0" width="1424" height="230" rx="42" fill="#FFFFFF" filter="url(#shadow)"/>
    <g transform="translate(42 35)">
      <rect width="160" height="160" rx="38" fill="url(#violet)"/>
      <g filter="url(#markShadow)">
        <path d="M33 84C33 50 59 24 93 24C127 24 153 50 153 84C153 118 127 144 93 144H64L35 158V129C23 118 17 103 17 84H33Z" fill="#FFF8EF"/>
        <path d="M58 84C58 65 73 50 92 50C111 50 126 65 126 84C126 103 111 118 92 118C73 118 58 103 58 84Z" fill="none" stroke="#140722" stroke-width="10"/>
        <path d="M78 84H106" stroke="#140722" stroke-width="10" stroke-linecap="round"/>
        <path d="M92 50V118" stroke="#140722" stroke-width="10" stroke-linecap="round"/>
        <path d="M22 67C12 76 7 88 7 102" fill="none" stroke="#7BE0B2" stroke-width="8" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(250 73)">
      <text x="0" y="0" class="label">Context Listener</text>
      <text x="0" y="34" class="note">AI node inside a call bubble. Softer and more “assistant memory” oriented.</text>
    </g>
    <g transform="translate(958 75)">
      <g transform="translate(0 0) scale(.62)">
        <path d="M33 84C33 50 59 24 93 24C127 24 153 50 153 84C153 118 127 144 93 144H64L35 158V129C23 118 17 103 17 84H33Z" fill="#140722"/>
        <path d="M58 84C58 65 73 50 92 50C111 50 126 65 126 84C126 103 111 118 92 118C73 118 58 103 58 84Z" fill="none" stroke="#FFF8EF" stroke-width="10"/>
        <path d="M78 84H106" stroke="#FFF8EF" stroke-width="10" stroke-linecap="round"/>
        <path d="M92 50V118" stroke="#FFF8EF" stroke-width="10" stroke-linecap="round"/>
      </g>
      <text x="112" y="66" class="word">Call Held</text>
    </g>
  </g>
</svg>
