<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Call Held script logo concepts</title>
  <desc id="desc">Script wordmark logo concepts for Call Held inspired by calm consumer app icon principles: gradient, soft typography, and minimal detail.</desc>
  <defs>
    <linearGradient id="dawnPurple" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8E74E8"/>
      <stop offset=".55" stop-color="#5A3CA3"/>
      <stop offset="1" stop-color="#1A0735"/>
    </linearGradient>
    <linearGradient id="twilight" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#77B8E8"/>
      <stop offset=".58" stop-color="#6D59D6"/>
      <stop offset="1" stop-color="#251046"/>
    </linearGradient>
    <linearGradient id="heldWarm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#745DD3"/>
      <stop offset=".52" stop-color="#33205F"/>
      <stop offset="1" stop-color="#130626"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#1A0735" flood-opacity=".20"/>
    </filter>
    <filter id="softText" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#1A0735" flood-opacity=".18"/>
    </filter>
    <style>
      .script {
        fill: #FFF8EF;
        font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", cursive;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      .label {
        fill: #17082F;
        font-family: Inter, Arial, sans-serif;
        font-size: 34px;
        font-weight: 820;
      }
      .note {
        fill: #60586D;
        font-family: Inter, Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
      }
      .tag {
        fill: #0B7E68;
        font-family: Inter, Arial, sans-serif;
        font-size: 16px;
        font-weight: 820;
        letter-spacing: .08em;
      }
    </style>
  </defs>

  <rect width="1500" height="720" fill="#F8F4FC"/>

  <g transform="translate(104 76)">
    <rect width="330" height="330" rx="74" fill="url(#dawnPurple)" filter="url(#cardShadow)"/>
    <text x="45" y="190" class="script" font-size="78" filter="url(#softText)">callheld</text>
    <path d="M102 218C146 235 206 235 251 218" fill="none" stroke="#FFF8EF" stroke-width="7" stroke-linecap="round" opacity=".72"/>
    <circle cx="262" cy="216" r="6" fill="#72D7A8"/>
    <text x="0" y="405" class="tag">SCRIPT DIRECTION</text>
    <text x="0" y="448" class="label">Soft Wordmark</text>
    <text x="0" y="480" class="note">Closest to the Calm-style simplicity.</text>
  </g>

  <g transform="translate(584 76)">
    <rect width="330" height="330" rx="74" fill="url(#twilight)" filter="url(#cardShadow)"/>
    <text x="47" y="190" class="script" font-size="75" filter="url(#softText)">call held</text>
    <path d="M76 219H253" stroke="#FFF8EF" stroke-width="7" stroke-linecap="round" opacity=".66"/>
    <path d="M272 202C286 216 294 234 294 254" fill="none" stroke="#FFF8EF" stroke-width="7" stroke-linecap="round" opacity=".62"/>
    <text x="0" y="448" class="label">Two-Word Script</text>
    <text x="0" y="480" class="note">More readable, but less ownable as an icon.</text>
  </g>

  <g transform="translate(1064 76)">
    <rect width="330" height="330" rx="74" fill="url(#heldWarm)" filter="url(#cardShadow)"/>
    <text x="42" y="181" class="script" font-size="72" filter="url(#softText)">callheld</text>
    <path d="M91 220C118 238 162 240 198 229C223 221 244 221 263 235" fill="none" stroke="#FFF8EF" stroke-width="8" stroke-linecap="round" opacity=".78"/>
    <path d="M263 205V251" stroke="#72D7A8" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="448" class="label">Held Stroke</text>
    <text x="0" y="480" class="note">Best balance: human script plus product meaning.</text>
  </g>

  <g transform="translate(104 606)">
    <text x="0" y="0" fill="#17082F" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="820">My take</text>
    <text x="0" y="38" fill="#60586D" font-family="Inter, Arial, sans-serif" font-size="21">
      A script icon can work if the wordmark is custom, very readable, and paired with one restrained “held call” stroke. Avoid copying Calm's blue square + white cursive formula too closely.
    </text>
  </g>
</svg>
